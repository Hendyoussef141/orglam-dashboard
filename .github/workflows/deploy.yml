name: Deploy

# Every push to main builds, signs and publishes the Android app (dashboard included), and
# deploys the Cloudflare Worker when the worker file changed.
#
# The worker is uploaded straight to Cloudflare's API with keep_bindings, NOT with wrangler.
# That is the whole point: wrangler deploys replace the worker's variables with whatever the
# repo declares, which is what wiped the plain-text ones (Shopify, Amazon, noon, Gmail,
# Firebase) and zeroed every number in the app - keep_vars did not stop it. keep_bindings works
# the other way round: Cloudflare carries the live variables, secrets and KV binding over from
# the previous version and the upload only replaces the code. The repo never declares a single
# value, so it cannot overwrite one.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needs the previous commit to see what changed

      # A push that only touched the app, a .bat or docs must not re-deploy the worker.
      - name: Does this push change the worker?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "worker=true" >> $GITHUB_OUTPUT; exit 0
          fi
          FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(Orglam Worker\.js|wrangler\.toml)$'; then
            echo "worker=true" >> $GITHUB_OUTPUT
          else
            echo "worker=false" >> $GITHUB_OUTPUT
            echo "The worker did not change - skipping the deploy."
          fi

      # A broken file has to fail HERE, not half-way through an upload that leaves the live
      # worker in pieces. Checked as .mjs: the worker is an ES module ("export default"), and
      # node reads a .js file as CommonJS, where that line is itself a syntax error.
      - name: Check the worker for syntax errors
        if: steps.changed.outputs.worker == 'true'
        run: |
          if [ ! -f "Orglam Worker.js" ]; then
            echo "\"Orglam Worker.js\" is not in the repository, so there is nothing to deploy."
            echo "Put it next to wrangler.toml and push again."
            exit 1
          fi
          cp "Orglam Worker.js" worker-check.mjs
          node --check worker-check.mjs

      # Records which variables/secrets/bindings the LIVE worker has, before anything is touched,
      # so the step after the upload can prove none of them disappeared.
      - name: Record the live worker's variables
        id: before
        if: steps.changed.outputs.worker == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME=$(sed -nE 's/^name *= *"([^"]+)".*/\1/p' wrangler.toml | head -1)
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/settings" \
            -H "Authorization: Bearer $CF_TOKEN" > before.json
          grep -o '"name":"[^"]*"' before.json | sort -u > before.txt || true
          echo "The live worker currently has these bindings:"
          cat before.txt
          test -s before.txt || { echo "Could not read the worker's bindings - refusing to deploy blind."; exit 1; }

      # compatibility_date is read from wrangler.toml so there is only one copy of it, and it is
      # the only thing the upload declares besides the code itself.
      - name: Upload the worker
        if: steps.changed.outputs.worker == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME=$(sed -nE 's/^name *= *"([^"]+)".*/\1/p' wrangler.toml | head -1)
          COMPAT=$(sed -nE 's/^compatibility_date *= *"([^"]+)".*/\1/p' wrangler.toml | head -1)
          echo "Deploying $NAME (compatibility_date $COMPAT)"
          cp "Orglam Worker.js" worker.js

          # keep_bindings: Cloudflare keeps the live plain-text variables, secrets and KV
          # binding from the previous version. Nothing here can replace a value.
          cat > metadata.json <<JSON
          {
            "main_module": "worker.js",
            "compatibility_date": "$COMPAT",
            "keep_bindings": ["plain_text", "json", "secret_text", "kv_namespace"]
          }
          JSON

          RESP=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata=@metadata.json;type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true' || {
            echo "The upload failed - the reason is above. The old worker is still live."
            exit 1
          }

      # The actual guarantee: if a single variable, secret or binding name is missing after the
      # upload, the run goes red and tells you to roll back - instead of the app quietly showing
      # zeros. keep_bindings should make this impossible; this is here because it happened once.
      - name: Prove no variable was lost
        if: steps.changed.outputs.worker == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME=$(sed -nE 's/^name *= *"([^"]+)".*/\1/p' wrangler.toml | head -1)
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/settings" \
            -H "Authorization: Bearer $CF_TOKEN" > after.json
          grep -o '"name":"[^"]*"' after.json | sort -u > after.txt || true
          MISSING=$(comm -23 before.txt after.txt)
          if [ -n "$MISSING" ]; then
            echo "These bindings existed before the deploy and are gone now:"
            echo "$MISSING"
            echo "Roll back immediately: run rollback-worker.bat, or Cloudflare dashboard ->"
            echo "Workers -> dawn-king-6cc3 -> Deployments -> the previous version -> Rollback."
            exit 1
          fi
          echo "All $(wc -l < before.txt) bindings survived the deploy."

      # The 1-minute cron drives every scheduled job. Uploading code does not touch triggers, but
      # re-asserting the schedule is idempotent and means the repo is the record of it.
      - name: Keep the 1-minute cron trigger
        if: steps.changed.outputs.worker == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME=$(sed -nE 's/^name *= *"([^"]+)".*/\1/p' wrangler.toml | head -1)
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME/schedules" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '[{"cron":"* * * * *"}]'
          echo

      # Proves the new code actually boots and can still read KV. A worker that throws on startup
      # answers 500 here, and the run goes red instead of failing silently in the app.
      - name: Check the live worker still answers
        if: steps.changed.outputs.worker == 'true'
        run: |
          sleep 5
          CODE=$(curl -s -o /tmp/body -w '%{http_code}' \
            "https://dawn-king-6cc3.orglam-service.workers.dev/orders-no-whatsapp")
          head -c 300 /tmp/body; echo
          if [ "$CODE" != "200" ]; then
            echo "The deployed worker answered HTTP $CODE. Roll back with rollback-worker.bat"
            echo "or in the Cloudflare dashboard (Workers -> dawn-king-6cc3 -> Deployments)."
            exit 1
          fi
          echo "Worker deployed and answering."

  android:
    name: Android build + publish
    runs-on: ubuntu-latest
    # Independent of the worker job on purpose - a worker-only push should not wait on anything.
    # Signing secrets are what make an installable build; without them this job would produce an
    # unsigned APK that no phone accepts, so it is skipped instead of failing every push.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BUILD_ANDROID == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needs the previous commit to see what changed

      # A push that only touched the worker, a .bat file or docs cannot change the APK, so the
      # whole build is skipped for it.
      - name: Does this push change the app?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> $GITHUB_OUTPUT; exit 0
          fi
          FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "$FILES"
          if echo "$FILES" | grep -qE '^orglam-app/'; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
            echo "Nothing under orglam-app/ changed - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: '21'   # Gradle 8 needs 17-24; 25 fails with "class file major version 69"
          cache: gradle

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.app == 'true'
        with:
          node-version: '22'   # the Capacitor CLI refuses to run on anything below 22
          cache: npm
          cache-dependency-path: orglam-app/package-lock.json

      - name: Cache the Android build
        if: steps.changed.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            orglam-app/android/.gradle
            orglam-app/android/build
            orglam-app/android/app/build
          key: android-${{ hashFiles('orglam-app/android/**/*.gradle', 'orglam-app/android/gradle/wrapper/gradle-wrapper.properties', 'orglam-app/package-lock.json') }}
          restore-keys: |
            android-

      # The version number must be a real, rising integer compiled INTO the apk - the phones compare
      # it against their own installed versionCode. The run number gives that for free.
      - name: Set the version number
        id: ver
        if: steps.changed.outputs.app == 'true'
        run: |
          VER=$(( ${{ github.run_number }} + 100 ))
          echo "code=$VER" >> $GITHUB_OUTPUT
          sed -i -E "s/versionCode +[0-9]+/versionCode $VER/" orglam-app/android/app/build.gradle
          sed -i -E "s/versionName +\"[^\"]*\"/versionName \"$VER.0\"/" orglam-app/android/app/build.gradle

      - name: Cache node_modules
        if: steps.changed.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: orglam-app/node_modules
          key: node-modules-${{ hashFiles('orglam-app/package-lock.json') }}

      # sync, not copy: the capacitor-cordova-android-plugins folder isn't in the repo (it's
      # generated), and copy alone leaves gradle looking for a cordova.variables.gradle that
      # doesn't exist.
      - name: Bundle the dashboard into the app
        if: steps.changed.outputs.app == 'true'
        run: |
          cd orglam-app
          [ -d node_modules ] || npm ci || npm install
          npx cap sync android

      # Git does not carry the executable bit through Windows, so gradlew arrives unrunnable here.
      - name: Make gradlew executable
        if: steps.changed.outputs.app == 'true'
        run: chmod +x orglam-app/android/gradlew

      - name: Restore the signing keystore
        if: steps.changed.outputs.app == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > orglam-app/android/app/release.jks
          if [ ! -s orglam-app/android/app/release.jks ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing or not valid base64."
            exit 1
          fi

      - name: Build the release APK
        if: steps.changed.outputs.app == 'true'
        working-directory: orglam-app/android
        env:
          ORGLAM_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORGLAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORGLAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel --configuration-cache -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Publish to every phone
        if: steps.changed.outputs.app == 'true'
        run: |
          APK=$(find orglam-app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced."; exit 1; fi
          echo "Publishing $APK as version ${{ steps.ver.outputs.code }}"
          curl -f -X PUT -T "$APK" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://dawn-king-6cc3.orglam-service.workers.dev/app-upload?versionCode=${{ steps.ver.outputs.code }}&by=github"
