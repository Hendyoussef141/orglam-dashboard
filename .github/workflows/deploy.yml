name: Deploy

# Every push to main builds, signs and publishes the Android app (dashboard included).
#
# Deploying the worker used to wipe its plain-text variables (Shopify, Amazon, noon, Gmail,
# Firebase) and zero every number in the app, because wrangler replaces variables with whatever
# the repo declares. Every one of those values is now stored as a Cloudflare SECRET instead, and
# secrets are left untouched by a deploy - which is what makes this safe to automate.
# Never add plain-text variables to this worker in the Cloudflare dashboard; use secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler expects the entrypoint named in wrangler.toml (main = "worker.js"); the file is
      # kept under its readable name in the repo.
      - name: Stage the worker entrypoint
        run: |
          cp "Orglam Worker.js" worker.js
          node --check worker.js   # a syntax error must fail here, not half-way through a deploy

      - name: Inject the KV namespace id
        run: sed -i "s/PASTE_YOUR_KV_NAMESPACE_ID/${{ secrets.KV_NAMESPACE_ID }}/" wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  android:
    name: Android build + publish
    runs-on: ubuntu-latest
    # Independent of the worker job on purpose - a worker-only push should not wait on anything.
    # Signing secrets are what make an installable build; without them this job would produce an
    # unsigned APK that no phone accepts, so it is skipped instead of failing every push.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BUILD_ANDROID == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needs the previous commit to see what changed

      # A push that only touched the worker, a .bat file or docs cannot change the APK, so the
      # whole 3-minute build is skipped for it.
      - name: Does this push change the app?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> $GITHUB_OUTPUT; exit 0
          fi
          FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          echo "$FILES"
          # Only the app's own files. Editing this workflow, a .bat or the worker does not change
          # what is inside the APK, and publishing a new version for it just makes every phone
          # prompt for an update that contains nothing new.
          if echo "$FILES" | grep -qE '^orglam-app/'; then
            echo "app=true" >> $GITHUB_OUTPUT
          else
            echo "app=false" >> $GITHUB_OUTPUT
            echo "Nothing under orglam-app/ changed - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.app == 'true'
        with:
          distribution: temurin
          java-version: '21'   # Gradle 8 needs 17-24; 25 fails with "class file major version 69"
          cache: gradle        # Gradle wrapper + dependency cache: most of the 3.5 min was re-downloading these

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.app == 'true'
        with:
          node-version: '22'   # the Capacitor CLI refuses to run on anything below 22
          cache: npm
          cache-dependency-path: orglam-app/package-lock.json

      # Compiled classes and the Gradle daemon's build cache, keyed on the gradle files - a run that
      # changes only the dashboard then recompiles almost nothing.
      - name: Cache the Android build
        if: steps.changed.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            orglam-app/android/.gradle
            orglam-app/android/build
            orglam-app/android/app/build
          key: android-${{ hashFiles('orglam-app/android/**/*.gradle', 'orglam-app/android/gradle/wrapper/gradle-wrapper.properties', 'orglam-app/package-lock.json') }}
          restore-keys: |
            android-

      # The version number must be a real, rising integer compiled INTO the apk - the phones compare
      # it against their own installed versionCode. The run number gives that for free and never
      # repeats.
      - name: Set the version number
        id: ver
        if: steps.changed.outputs.app == 'true'
        run: |
          VER=$(( ${{ github.run_number }} + 100 ))
          echo "code=$VER" >> $GITHUB_OUTPUT
          sed -i -E "s/versionCode +[0-9]+/versionCode $VER/" orglam-app/android/app/build.gradle
          sed -i -E "s/versionName +\"[^\"]*\"/versionName \"$VER.0\"/" orglam-app/android/app/build.gradle

      # sync, not copy: the capacitor-cordova-android-plugins folder isn't in the repo (it's
      # generated), and copy alone leaves gradle looking for a cordova.variables.gradle that
      # doesn't exist. sync regenerates it and then copies the web assets.
      # node_modules cached outright: `npm ci` deletes and reinstalls it on every run otherwise,
      # which is ~20s for a dependency set that almost never changes.
      - name: Cache node_modules
        if: steps.changed.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: orglam-app/node_modules
          key: node-modules-${{ hashFiles('orglam-app/package-lock.json') }}

      - name: Bundle the dashboard into the app
        if: steps.changed.outputs.app == 'true'
        run: |
          cd orglam-app
          # Skips the reinstall entirely when the cache above restored a matching tree.
          [ -d node_modules ] || npm ci || npm install
          npx cap sync android

      # Git does not carry the executable bit through Windows, so gradlew arrives unrunnable here
      # and the build dies immediately with "Permission denied".
      - name: Make gradlew executable
        if: steps.changed.outputs.app == 'true'
        run: chmod +x orglam-app/android/gradlew

      # The same keystore the installed app was signed with, stored as a base64 secret - a build
      # signed with a different key cannot install over what is already on people's phones.
      - name: Restore the signing keystore
        if: steps.changed.outputs.app == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > orglam-app/android/app/release.jks
          # An empty or malformed keystore would produce an unsigned APK that quietly fails to
          # install on every phone, so it has to stop the run here instead.
          if [ ! -s orglam-app/android/app/release.jks ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing or not valid base64."
            exit 1
          fi

      - name: Build the release APK
        if: steps.changed.outputs.app == 'true'
        working-directory: orglam-app/android
        env:
          ORGLAM_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORGLAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORGLAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # --build-cache reuses compiled output across runs; --parallel and the configuration cache
        # cut the rest. Lint is excluded - it runs automatically on a release build and is the
        # single slowest task here, while checking source that a person already reviewed.
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel --configuration-cache -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Publish to every phone
        if: steps.changed.outputs.app == 'true'
        run: |
          APK=$(find orglam-app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced."; exit 1; fi
          echo "Publishing $APK as version ${{ steps.ver.outputs.code }}"
          curl -f -X PUT -T "$APK" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://dawn-king-6cc3.orglam-service.workers.dev/app-upload?versionCode=${{ steps.ver.outputs.code }}&by=github"
